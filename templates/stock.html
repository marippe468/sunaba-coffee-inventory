<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>入出荷管理 | SUNABA COFFEE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>SUNABA COFFEE</h1>
        <p>在庫管理システム</p>
    </header>

    <main>

        <h2>入出荷管理</h2>

        <!-- 画面メニュー -->
        <nav>
            <a href="{{ url_for('home') }}">商品在庫状況</a>
            |
            <a href="{{ url_for('history') }}">処理履歴</a>
            |
            <a href="{{ url_for('product_new') }}">コード登録</a>
        </nav>

        <!-- 入出荷登録フォーム -->
        <section class="form-card">

            <form method="POST">

                <!-- 商品 -->
                <div class="form-group">
                    <label for="product_id">商品</label>

                    <select id="product_id"
                            name="product_id"
                            required>

                        {% for product in products %}

                        <option value="{{ product[0] }}">
                            {{ product[1] }}
                        </option>

                        {% endfor %}

                    </select>
                </div>


                <!-- 処理区分 -->
                <div class="form-group">
                    <label for="type">処理区分</label>

                    <select id="type"
                            name="type"
                            required>

                        <option value="入荷">入荷</option>
                        <option value="消費">消費</option>
                        <option value="廃棄">廃棄</option>

                    </select>
                </div>


                <!-- 数量 -->
                <div class="form-group">
                    <label for="quantity">数量</label>

                    <input type="number"
                           id="quantity"
                           name="quantity"
                           min="1"
                           required>
                </div>


                <!-- 登録ボタン -->
                <button type="submit"
                        class="primary-button">
                    登録
                </button>

            </form>

        </section>

    </main>

</body>

</html>
