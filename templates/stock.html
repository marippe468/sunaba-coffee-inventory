<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>入出荷管理 | SUNABA COFFEE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <header class="app-header">

        <div class="header-side">
            <span class="logo-mark"></span>
        </div>

        <div class="header-title">
            <h1>SUNABA COFFEE 在庫管理システム</h1>
            <p>-SUNABA Inventory Management System(IMS)-</p>
            <p id="current-date-time"></p>
        </div>

        <div class="header-side header-setting">
            ⚙
        </div>

    </header>


    <main class="app-main">

        <h2>入出荷管理</h2>

        <section class="form-card">

            <form method="POST">

                <div class="form-group">

                    <label for="product_id">
                        商品
                    </label>

                    <select id="product_id"
                            name="product_id"
                            required>

                        {% for product in products %}

                            <option value="{{ product[0] }}">
                                {{ product[1] }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="type">
                        処理区分
                    </label>

                    <select id="type"
                            name="type"
                            required>

                        <option value="入荷">
                            入荷
                        </option>

                        <option value="消費">
                            消費
                        </option>

                        <option value="廃棄">
                            廃棄
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="quantity">
                        数量
                    </label>

                    <input type="number"
                           id="quantity"
                           name="quantity"
                           min="1"
                           placeholder="数量を入力"
                           required>

                </div>


                <button type="submit"
                        class="primary-button">

                    登録

                </button>

            </form>

        </section>

    </main>


    <div class="bottom-area">

        <nav class="bottom-nav">

            <a href="{{ url_for('home') }}">
                TOP
            </a>

            <a href="{{ url_for('product_new') }}">
                商品管理
            </a>

            <a href="{{ url_for('stock') }}"
               class="active">
                入出荷管理
            </a>

            <a href="{{ url_for('history') }}">
                履歴管理
            </a>

        </nav>


        <footer class="app-footer">

            <span>@SUNABA COFFEE</span>

            <span class="footer-divider">|</span>

            <span>IMS</span>

        </footer>

    </div>

</div>


<script>
    function updateDateTime() {

        const now = new Date();

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        const hour = String(now.getHours()).padStart(2, "0");
        const minute = String(now.getMinutes()).padStart(2, "0");

        document.getElementById("current-date-time").textContent =
            `${year}/${month}/${day} | ${hour}:${minute}`;
    }

    updateDateTime();

    setInterval(updateDateTime, 60000);
</script>

</body>

</html>
