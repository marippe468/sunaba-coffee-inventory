<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>コード登録 | SUNABA COFFEE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>SUNABA COFFEE</h1>
        <p>在庫管理システム</p>
    </header>

    <main>

        <h2>コード登録</h2>

        <!-- 画面メニュー -->
        <nav>
            <a href="{{ url_for('home') }}">商品在庫状況</a>
            |
            <a href="{{ url_for('stock') }}">入出荷登録</a>
            |
            <a href="{{ url_for('history') }}">処理履歴</a>
        </nav>

        <!-- 商品登録フォーム -->
        <section class="form-card">

            <form method="POST">

                <!-- 商品名 -->
                <div class="form-group">
                    <label for="product_name">商品名</label>

                    <input type="text"
                           id="product_name"
                           name="product_name"
                           required>
                </div>


                <!-- 単位 -->
                <div class="form-group">
                    <label for="unit">単位</label>

                    <input type="text"
                           id="unit"
                           name="unit"
                           placeholder="例：kg、L、個"
                           required>
                </div>


                <!-- 適正在庫 -->
                <div class="form-group">
                    <label for="ideal_stock">適正在庫</label>

                    <input type="number"
                           id="ideal_stock"
                           name="ideal_stock"
                           min="0"
                           required>
                </div>


                <!-- 現在庫 -->
                <div class="form-group">
                    <label for="stock">現在庫</label>

                    <input type="number"
                           id="stock"
                           name="stock"
                           min="0"
                           required>
                </div>


                <!-- 登録ボタン -->
                <button type="submit"
                        class="primary-button">
                    登録
                </button>

            </form>

        </section>

    </main>

</body>

</html>
