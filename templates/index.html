<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUNABA COFFEE 在庫管理システム</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>SUNABA COFFEE</h1>
        <p>在庫管理システム</p>
    </header>

    <main>

        <h2>商品在庫状況</h2>

        <!-- メニュー -->
        <nav>
            <a href="{{ url_for('stock') }}">入出荷登録</a>
            |
            <a href="{{ url_for('history') }}">処理履歴</a>
            |
            <a href="{{ url_for('product_new') }}">コード登録</a>
        </nav>

        <!-- 商品在庫一覧 -->
        <table>

            <thead>
                <tr>
                    <th>商品ID</th>
                    <th>商品名</th>
                    <th>現在庫</th>
                    <th>単位</th>
                    <th>適正在庫</th>
                    <th>状態</th>
                </tr>
            </thead>

            <tbody>

                {% for product in products %}

                <tr>
                    <td>{{ product[0] }}</td>
                    <td>{{ product[1] }}</td>
                    <td>{{ product[2] }}</td>
                    <td>{{ product[3] }}</td>
                    <td>{{ product[4] }}</td>

                    <td>
                        {% if product[2] < product[4] %}
                            <span class="status shortage">
                                不足
                            </span>
                        {% else %}
                            <span class="status appropriate">
                                適正
                            </span>
                        {% endif %}
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </main>

</body>

</html>
