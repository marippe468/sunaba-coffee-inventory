<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUNABA COFFEE 在庫管理システム</title>
</head>

<body>

    <h1>SUNABA COFFEE 在庫管理システム</h1>

    <h2>商品在庫状況</h2>

    <!-- 画面移動 -->
    <p>
        <a href="{{ url_for('stock') }}">入出荷登録</a>
        |
        <a href="{{ url_for('history') }}">処理履歴</a>
        |
        <a href="{{ url_for('product_new') }}">コード登録</a>
    </p>

    <!-- 商品在庫一覧 -->
    <table border="1">

        <tr>
            <th>商品ID</th>
            <th>商品名</th>
            <th>現在庫</th>
            <th>単位</th>
            <th>適正在庫</th>
            <th>状態</th>
        </tr>

        {% for product in products %}

        <tr>
            <td>{{ product[0] }}</td>
            <td>{{ product[1] }}</td>
            <td>{{ product[2] }}</td>
            <td>{{ product[3] }}</td>
            <td>{{ product[4] }}</td>

            <td>
                {% if product[2] < product[4] %}
                    不足
                {% else %}
                    適正
                {% endif %}
            </td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>
